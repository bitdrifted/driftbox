[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftbox"
version = "0.1.0"
description = "A cross-platform terminal toolkit for system inspection, security checks, and resilient operations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "bitdrifted" }
]
keywords = [
    "terminal",
    "security",
    "system-inspection",
    "linux",
    "windows",
    "wsl"
]

[project.scripts]
driftbox = "driftbox.cli:main"

[tool.setuptools.packages.find]
include = ["driftbox*"]
